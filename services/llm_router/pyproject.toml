[tool.poetry]
name = "llm-router"
version = "0.1.0"
description = "Agent OS LLM Router - tier-routed inference and the ten-stage prompt pipeline (02.3.8, 02.8.5)."
authors = ["Agent OS"]
packages = [{ include = "llm_router" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
kernel = { path = "../../libs/kernel", develop = true }
core = { path = "../../libs/core", develop = true }
persistence = { path = "../../libs/persistence", develop = true }
security-gateway = { path = "../security_gateway", develop = true }
cost-manager = { path = "../cost_manager", develop = true }
memory-gateway = { path = "../memory_gateway", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
