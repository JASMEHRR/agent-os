[tool.poetry]
name = "security-gateway"
version = "0.1.0"
description = "Agent OS Security Gateway — trust substrate (realizes document 14, 21B §22)."
authors = ["Agent OS"]
packages = [{ include = "security_gateway" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
kernel = { path = "../../libs/kernel", develop = true }
core = { path = "../../libs/core", develop = true }
persistence = { path = "../../libs/persistence", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
