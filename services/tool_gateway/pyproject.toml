[tool.poetry]
name = "tool-gateway"
version = "0.1.0"
description = "Agent OS Tool Gateway - authorizes every invocation (realizes 12.6.2, 21B 19)."
authors = ["Agent OS"]
packages = [{ include = "tool_gateway" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
kernel = { path = "../../libs/kernel", develop = true }
core = { path = "../../libs/core", develop = true }
persistence = { path = "../../libs/persistence", develop = true }
security-gateway = { path = "../security_gateway", develop = true }
decision-gateway = { path = "../decision_gateway", develop = true }
cost-manager = { path = "../cost_manager", develop = true }
tool-registry = { path = "../tool_registry", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
