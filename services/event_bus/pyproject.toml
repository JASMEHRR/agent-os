[tool.poetry]
name = "event-bus"
version = "0.1.0"
description = "Agent OS Event Bus - the system's nervous system (realizes document 08, 21B 15)."
authors = ["Agent OS"]
packages = [{ include = "event_bus" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
kernel = { path = "../../libs/kernel", develop = true }
core = { path = "../../libs/core", develop = true }
persistence = { path = "../../libs/persistence", develop = true }
schema-registry = { path = "../schema_registry", develop = true }
security-gateway = { path = "../security_gateway", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
