[tool.poetry]
name = "workflow-engine"
version = "0.1.0"
description = "Agent OS workflow_engine (Stage S7 - First Light)."
authors = ["Agent OS"]
packages = [{ include = "workflow_engine" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
kernel = { path = "../../libs/kernel", develop = true }
core = { path = "../../libs/core", develop = true }
persistence = { path = "../../libs/persistence", develop = true }
security-gateway = { path = "../security_gateway", develop = true }
agent-runtime = { path = "../agent_runtime", develop = true }
decision-gateway = { path = "../decision_gateway", develop = true }
cost-manager = { path = "../cost_manager", develop = true }
tool-gateway = { path = "../tool_gateway", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
