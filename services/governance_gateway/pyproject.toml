[tool.poetry]
name = "governance-gateway"
version = "0.1.0"
description = "Agent OS governance_gateway (Stage S10 - Oversight)."
authors = ["Agent OS"]
packages = [{ include = "governance_gateway" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
kernel = { path = "../../libs/kernel", develop = true }
core = { path = "../../libs/core", develop = true }
security-gateway = { path = "../security_gateway", develop = true }
observability-gateway = { path = "../observability_gateway", develop = true }
learning-gateway = { path = "../learning_gateway", develop = true }
decision-gateway = { path = "../decision_gateway", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
