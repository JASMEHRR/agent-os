[tool.poetry]
name = "schema-registry"
version = "0.1.0"
description = "Agent OS schema validation and versioning service (realizes 08.16.1, 10.16.2, 12.7.3)."
authors = ["Agent OS"]
packages = [{ include = "schema_registry" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
core = { path = "../../libs/core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
