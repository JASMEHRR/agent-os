[tool.poetry]
name = "persistence"
version = "0.1.0"
description = "Agent OS hexagonal ports-and-adapters data access layer (realizes 01.7.1, 02.7)."
authors = ["Agent OS"]
packages = [{ include = "persistence" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
core = { path = "../core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
mypy = "^1.10"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
