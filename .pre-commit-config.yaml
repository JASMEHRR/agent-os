# Every version here is pinned to the toolchain the repository is actually
# developed against, and CI pins the same versions.
#
# This matters more than it looks. The hook was previously pinned to ruff
# v0.4.10 while the local toolchain ran 0.16.1, and the two formatters
# disagreed — so every commit reformatted files one way and the next local
# run reformatted them back. A gate that fights the developer is a gate that
# gets bypassed. One version, three places, no ping-pong.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # `ruff-check`, not `ruff`: the latter is a legacy alias in 0.16 and
      # the hook says so on every run.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # The hook runs in its own isolated env, so anything the type
        # checker must resolve has to be listed here — pytest included, or
        # every test module fails with import-not-found.
        additional_dependencies: [pydantic>=2.7.0, pytest>=8.2]
        pass_filenames: false
        args: ["."]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", "libs", "services", "--exclude", "*/tests/*"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest libs/ services/ tests/ -q
        language: system
        pass_filenames: false
        always_run: true
